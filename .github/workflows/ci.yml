name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: dbt build + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Données AI4I (téléchargées si absentes du dépôt)
        run: python scripts/fetch_data.py

      - name: Ingestion (dlt -> DuckDB)
        run: python src/ingestion.py

      - name: dbt build (modèles + tests de données)
        working-directory: dbt_project
        run: dbt build --profiles-dir .

      - name: pytest
        run: python -m pytest -v

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t ai4i-maintenance .
